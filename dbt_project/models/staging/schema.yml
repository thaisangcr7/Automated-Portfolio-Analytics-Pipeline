version: 2

models:
  - name: stg_stock_prices
    description: >
      Cleaned and deduplicated stock prices from raw.stock_prices.
      One row per trading date per ticker. Columns renamed and cast to
      correct types. Duplicates removed by keeping the latest extracted_at.
    columns:
      - name: stock_id
        description: Surrogate key — price_date concatenated with ticker
        tests:
          - unique
          - not_null
      - name: price_date
        description: The trading date
        tests:
          - not_null
      - name: ticker
        description: Stock ticker symbol
        tests:
          - not_null
          - accepted_values:
              values: ['AAPL', 'MSFT', 'GOOG', 'JPM', 'C']
      - name: close_price
        description: Closing price for the day
        tests:
          - not_null

  - name: stg_portfolio_holdings
    description: >
      Portfolio holdings loaded from seeds/portfolio_holdings.csv.
      One row per ticker representing how many shares we own and at
      what cost basis.
    columns:
      - name: ticker
        description: Stock ticker symbol — must be unique (one holding per ticker)
        tests:
          - unique
          - not_null
          - accepted_values:
              values: ['AAPL', 'MSFT', 'GOOG', 'JPM', 'C']
      - name: shares
        description: Number of shares held
        tests:
          - not_null
      - name: cost_basis_per_share
        description: Average price paid per share
        tests:
          - not_null
